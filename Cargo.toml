[package]
name = "sorta"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Ultra-light, offline-first semantic document sorter for Windows and Linux"
license = "MIT"
repository = "https://github.com/drsamonline/Sorta"
homepage = "https://github.com/drsamonline/Sorta"
readme = "README.md"
keywords = ["files", "sorting", "tray", "offline", "rust"]
categories = ["command-line-utilities", "filesystem"]
default-run = "sorta"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argh = "0.1"
blake3 = "1"
# Retention can compress instead of deleting.
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
infer = "0.19"
# Extraction backends, pulled in only by `format-basic`. Both are pure Rust:
# no C runtime, no LibreOffice, no model files.
pdf-extract = { version = "0.8", optional = true }
# Also used by Sorta Packs, so it is not behind a feature.
zip = { version = "2", default-features = false, features = ["deflate"] }
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"

# OS keychain for the vault, opt-in. Feature names are the ones DayDoc (same
# author, same toolchain) builds with; `linux-native` uses the Secret Service and
# `windows-native` the Credential Manager. A machine without either falls back to
# `[vault] key_command` and then the key file.
keyring = { version = "3", default-features = false, features = ["linux-native", "windows-native"], optional = true }

# Experimental SQL index (see src/turso_index.rs). Off by default: every published
# turso version is a pre-release, and it is async. Pure Rust, no C toolchain.
turso = { version = "0.9.0-pre.5", optional = true }
tokio = { version = "1", optional = true, features = ["rt"] }

[target.'cfg(windows)'.dependencies]
# Drive-type detection (GetDriveTypeW) so a network share gets the slow polling
# cadence instead of inotify. Windows-only, so it never touches the Linux build.
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

# ---------------------------------------------------------------------------
# Feature flags. The `model-*` and `plugins`/`preview`/`tts` flags are declared
# up front so the CLI surface and the release workflow are stable, but the
# inference runtime and GUI land in a later phase (see docs/ROADMAP.md).
# Everything in the default build is pure Rust with no C/C++ runtime.
# ---------------------------------------------------------------------------
[features]
default = ["format-basic", "format-ocr"]

# Extraction backends (xberg behind feature flags).
format-basic = ["dep:pdf-extract"]
format-ocr = []
format-media = []
format-archive = []

# Bundled Tier 0 model stack (rten).
model-intent-deberta = []
model-intent-tinybert = []
model-embeddings-minilm = []
model-ner-tiny = []
model-ocr-rapid = []
model-extract-sanga = []

# Opt-in downloads.
model-smollm-pro = []
model-gliner = []

# Optional subsystems.
plugins = []
index-turso = ["dep:turso", "dep:tokio"]
# Read the vault key from the OS keychain.
vault-keyring = ["dep:keyring"]
preview = []
tts = []
nightly-size = []

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
