name: Format fix (temporary)

on:
  push:
    paths:
      - '.github/workflows/fmtfix.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Clippy fix
        run: cargo clippy --fix --allow-dirty --allow-staged --all-targets -- -W clippy::all
        continue-on-error: true
      - name: Format
        run: cargo fmt --all
      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-src
          path: |
            src
            tests
