name: Extraction benchmark

# Push-triggered on this file only, because the GitHub App cannot dispatch
# workflows. Touch the file to re-run it; the report lands in the job log.

on:
  push:
    paths:
      - '.github/workflows/bench.yml'

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Fetch a real corpus from the fleet
        run: |
          git clone --depth 1 https://github.com/drsamonline/corpus-extendum.git corpus
          git clone --depth 1 https://github.com/drsamonline/lm-kit.git kit
      - name: Build
        run: cargo build --release
      - name: Measure
        run: |
          ./target/release/sorta bench-extract --limit 120 corpus kit | tee report.md
          echo
          echo "=== binary documents only ==="
          ./target/release/sorta bench-extract --only pdf,docx,pptx,xlsx,epub --limit 200 corpus kit | tee binary.md
          echo
          echo "=== classification ==="
          ./target/release/sorta bench-classify --limit 150 corpus kit | tee classify.md

      - name: Performance budget
        run: |
          # /usr/bin/time reports hundredths, which is too coarse here; time 20 runs
          # and divide, so the number is a real millisecond figure.
          echo "=== cold start (20 runs each) ==="
          for cmd in "--version" "status"; do
            START=$(date +%s%N)
            for i in $(seq 20); do ./target/release/sorta $cmd > /dev/null; done
            END=$(date +%s%N)
            echo "  sorta $cmd  $(( (END - START) / 20000000 )) ms avg"
          done

          echo "=== resident size ==="
          /usr/bin/time -f "  sorta status  %M KB peak" ./target/release/sorta status > /dev/null

          echo "=== idle RAM of the watch daemon ==="
          mkdir -p /tmp/watched
          ./target/release/sorta watch /tmp/watched > /tmp/watch.log 2>&1 &
          WATCH_PID=$!
          sleep 5
          if kill -0 "$WATCH_PID" 2>/dev/null; then
            RSS=$(ps -o rss= -p "$WATCH_PID" | tr -d ' ')
            echo "  sorta watch  $((RSS / 1024)) MB rss after 5 s"
            kill "$WATCH_PID" 2>/dev/null || true
          else
            echo "  watch exited early:"
            cat /tmp/watch.log
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: extraction-report
          path: report.md
