name: Extraction benchmark

# Push-triggered on this file only, because the GitHub App cannot dispatch
# workflows. Touch the file to re-run it; the report lands in the job log.

on:
  push:
    paths:
      - '.github/workflows/bench.yml'

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Fetch a real corpus from the fleet
        run: |
          git clone --depth 1 https://github.com/drsamonline/corpus-extendum.git corpus
          git clone --depth 1 https://github.com/drsamonline/lm-kit.git kit
      - name: Build
        run: cargo build --release
      - name: Measure
        run: |
          ./target/release/sorta bench-extract --limit 120 corpus kit | tee report.md
          echo
          echo "=== binary documents only ==="
          ./target/release/sorta bench-extract --only pdf,docx,pptx,xlsx,epub --limit 200 corpus kit | tee binary.md
          echo
          echo "=== classification ==="
          ./target/release/sorta bench-classify --limit 150 corpus kit | tee classify.md
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: extraction-report
          path: report.md
