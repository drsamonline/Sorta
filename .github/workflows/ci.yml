name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets --no-fail-fast

      - name: Build (release, lean)
        run: cargo build --release --no-default-features --features format-basic,format-ocr

      - name: Report binary size
        shell: bash
        run: |
          if [ -f target/release/sorta.exe ]; then
            BIN=target/release/sorta.exe
          else
            BIN=target/release/sorta
          fi
          SIZE=$(stat -c %s "$BIN" 2>/dev/null || stat -f %z "$BIN")
          echo "$BIN is $((SIZE / 1024)) KB"
          echo "### Binary size: $((SIZE / 1024)) KB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt $((20 * 1024 * 1024)) ]; then
            echo "::error::core binary exceeds the 20 MB budget"
            exit 1
          fi

  turso-spike:
    name: Turso index spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Exploratory: reports whether the optional `index-turso` backend compiles and
    # passes its tests on stable Rust, without gating the default build.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build with the Turso backend
        run: cargo build --no-default-features --features format-basic,index-turso
      - name: Test the Turso backend
        run: cargo test --no-default-features --features format-basic,index-turso turso_index

  unused-deps:
    name: Unused dependencies
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-shear
        run: |
          cargo install cargo-shear --locked
          cargo shear

  keyring:
    # Exploratory like the Turso job: the keychain cannot be exercised on a runner,
    # so this proves the feature compiles on both platforms without gating the build.
    name: Vault keychain build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build with the keychain
        run: cargo build --no-default-features --features format-basic,vault-keyring

  gui:
    # Compile-only, and non-gating: the window has never been looked at on a screen,
    # so this proves the feature builds and nothing more. Linux needs the X11/GL
    # headers eframe links against.
    name: GUI build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libgl1-mesa-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build with the window
        run: cargo build --no-default-features --features format-basic,gui
